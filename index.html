<style>
:root{
  color-scheme:dark;
  --accent:#fa2d48;--panel:rgba(255,255,255,.12);--panel-border:rgba(255,255,255,.2);
  --text:#fff;--dim:rgba(255,255,255,.62);--radius:22px;--btn-radius:12px;--blur:28px;
  --font:-apple-system,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --weight:500;--track:.01em;
}
[data-skin=spotify]{
  --accent:#1ed760;--panel:rgba(18,18,18,.88);--panel-border:rgba(255,255,255,.07);
  --radius:12px;--btn-radius:999px;--blur:0px;
  --font:"Circular Std","Montserrat","Segoe UI",system-ui,sans-serif;
  --weight:700;--track:0;
}
*{box-sizing:border-box}
html,body{margin:0;position:fixed;inset:0;background:#000;color:var(--text);font-family:var(--font);overflow:hidden;
  touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
.ui{position:fixed;z-index:2;transition:opacity .5s,transform .5s}
body.idle{cursor:none}
body.idle .ui{opacity:0;pointer-events:none}
body.idle .bottom{transform:translate(-50%,12px)}

.top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(18px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right)) 18px calc(22px + env(safe-area-inset-left))}
.brand{--ls:.42em;display:flex;align-items:center;font-weight:700;letter-spacing:var(--ls);font-size:13px;opacity:.9}
.brand svg{width:1.05em;height:1.05em;margin-right:var(--ls);fill:none;stroke:#4da3ff;stroke-width:2.8;stroke-linecap:round}
.seg{display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--panel-border);
  border-radius:var(--btn-radius);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.6);backdrop-filter:blur(var(--blur)) saturate(1.6)}
.seg button{border:0;background:none;padding:7px 14px;border-radius:calc(var(--btn-radius) - 2px)}
.seg button.on{background:var(--accent);color:#fff}
[data-skin=spotify] .seg button.on{color:#000}

button{font:inherit;font-size:13px;font-weight:var(--weight);letter-spacing:var(--track);color:var(--text);
  background:rgba(255,255,255,.1);border:1px solid transparent;border-radius:var(--btn-radius);
  padding:8px 14px;cursor:pointer;transition:background .15s,transform .1s,color .15s}
@media(hover:hover){button:hover{background:rgba(255,255,255,.2)}#bPlay:hover{transform:scale(1.06)}.thumbs img:hover{opacity:.9}}
@media(pointer:coarse){button{min-height:40px}button.icon{min-width:40px}input[type=range]{height:24px}}
[hidden]{display:none!important}
button:active{transform:scale(.95)}
button.on{background:var(--accent);color:#fff}
[data-skin=spotify] button.on{color:#000}
button.icon{padding:8px;display:grid;place-items:center;border-radius:50%}
button.icon svg{width:18px;height:18px;fill:currentColor;display:block}
#bPlay{background:var(--text);color:#000;padding:10px}

.bottom{left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(760px,calc(100vw - 24px));display:grid;grid-template-columns:minmax(0,1fr);gap:10px;justify-items:center}
.dock{width:100%;min-width:0;background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--radius);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.6);backdrop-filter:blur(var(--blur)) saturate(1.6);
  padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap}
input[type=range]{accent-color:var(--accent);height:4px;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent)}
#sens,#vol{width:90px}
#seek{flex:1;min-width:120px}
.time{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:30px;text-align:center}
#track{font-size:13px;font-weight:600;max-width:200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#lyr{position:fixed;left:0;right:0;z-index:1;height:6.4em;font-size:clamp(17px,2.6vw,24px);overflow:hidden;pointer-events:none;text-align:center;
  -webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
#lyrIn{max-width:760px;margin:0 auto;padding:0 24px;will-change:transform;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#lyrIn p{margin:0;padding:.28em 0;font-weight:700;line-height:1.25;color:#fff;opacity:.3;transform:scale(.86);
  transition:opacity .4s,transform .3s;text-shadow:0 2px 14px rgba(0,0,0,.6);text-wrap:balance}
#lyrIn p.on{opacity:1;transform:scale(calc(1 + var(--beat,0)*.03))}
#lyr.hl{height:7.4em;font-size:clamp(20px,3.3vw,30px);background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#lyr.hl p{width:fit-content;max-width:100%;margin:.12em auto;padding:.18em .6em;border-radius:.45em;opacity:.6}
#lyr.hl p.on{opacity:1;background:var(--accent);box-shadow:0 4px 18px rgba(0,0,0,.35);
  background:linear-gradient(90deg,var(--accent) var(--p,0%),color-mix(in srgb,var(--accent) 38%,transparent) var(--p,0%))}
[data-skin=spotify] #lyr.hl p.on{color:#000;text-shadow:none}
#lyrOff{min-width:58px;font-size:12px}
#linkIn{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--text);background:rgba(255,255,255,.1);
  border:1px solid var(--panel-border);border-radius:var(--btn-radius);padding:8px 12px;outline:none;
  -webkit-user-select:text;user-select:text}
#linkIn:focus{border-color:var(--accent)}
#linkIn::placeholder{color:var(--dim)}
.row>#bGo{flex:none}
.ext{left:0;top:0;z-index:3;width:min(220px,58vw);border-radius:14px;overflow:hidden;background:#000;
  border:1px solid var(--panel-border);box-shadow:0 10px 30px rgba(0,0,0,.45);will-change:transform;
  transition:opacity .5s,transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.ext.dragging{transition:opacity .5s,box-shadow .2s;box-shadow:0 20px 48px rgba(0,0,0,.65)}
.ext.dragging iframe{pointer-events:none}
@media(min-width:561px){.ext{width:320px}}
.grip{height:30px;display:flex;align-items:center;justify-content:center;position:relative;cursor:grab;touch-action:none;background:rgba(255,255,255,.1)}
.grip span{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.5)}
.ext.dragging .grip{cursor:grabbing}
#extBox{aspect-ratio:16/9}
.ext iframe{width:100%;height:100%;border:0;display:block}
#bSync{position:absolute;top:4px;left:5px;height:22px;min-width:0;min-height:0;padding:0 10px;font-size:11px;line-height:1;border-radius:999px;background:rgba(255,255,255,.18)}
#bExtX{position:absolute;top:1px;right:2px;width:28px;height:28px;min-width:0;min-height:0;padding:0;font-size:16px;line-height:1;border-radius:50%;background:none}

.thumbs{display:flex;gap:6px;max-width:100%;overflow-x:auto;padding:4px;-webkit-overflow-scrolling:touch}
.thumbs:empty{display:none}
.thumbs img{width:44px;height:44px;object-fit:cover;border-radius:calc(var(--radius) / 2.4);cursor:pointer;
  opacity:.55;outline:2px solid transparent;outline-offset:1px;transition:opacity .2s,outline-color .2s;flex:none}
.thumbs img.on{opacity:1;outline-color:var(--accent)}
.thumbs button{flex:none;width:44px;height:44px;padding:0;font-size:18px;border-radius:calc(var(--radius) / 2.4)}

<script>
// surface script failures on screen, since phones have no console
window.onerror=(m,s,l)=>{const h=document.getElementById('hint');if(h){h.textContent='Error: '+m+' (line '+l+')';h.classList.remove('hide')}};
const $=id=>document.getElementById(id);
const ICON={
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
};
const THEMES={
  apple:[[.98,.18,.28],[.64,.30,.96],[1,.54,.24]],
  spotify:[[.12,.84,.38],[.05,.36,.18],[.12,.2,.39]]
};
const audio=$('audio');

// ---------- state ----------
let theme='apple',themeF=0,mode='idle',sens=1,usePhotoColors=true;
const L={bass:0,mid:0,treb:0,beat:0};
const N=64,bars=new Float32Array(N);
let pal=THEMES.apple.map(c=>c.slice());
let rot=0,beats=0,lastBeat=0,lastSwitch=0;
const BGS=['Clouds','Aurora','Liquid','Tunnel','Stars','Kaleido','Grid','Waves','Mosaic'];
let bg=0,bgNext=0,dip=0,flow=0;
const hist=[],rings=[],parts=[];

// ---------- WebGL ----------
const glc=$('gl'),gl=glc.getContext('webgl2',{antialias:false,alpha:false});
const fxc=$('fx'),x=fxc.getContext('2d');
glc.addEventListener('webglcontextlost',e=>e.preventDefault());
glc.addEventListener('webglcontextrestored',()=>{initGL();resize();for(const p of photos)p.tex=makeTex(p.src)});
const VS=`#version 300 es
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uTime,uBass,uMid,uTreb,uBeat,uTheme,uMix,uHas,uAspA,uAspB,uArt,uRot,uCy,uBg,uFlow,uDip;
uniform vec3 uC1,uC2,uC3;
uniform sampler2D uA,uB;
out vec4 o;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+17.;a*=.5;}return s;}
vec2 cover(vec2 uv,float ra,float ia){vec2 s=ra>ia?vec2(1.,ia/ra):vec2(ra/ia,1.);return (uv-.5)*s+.5;}
vec3 photo(vec2 uv,float ra,float lod){
  return mix(textureLod(uA,cover(uv,ra,uAspA),lod).rgb,textureLod(uB,cover(uv,ra,uAspB),lod).rgb,uMix);}
vec3 pal(float x){x=clamp(x,0.,1.);return x<.5?mix(uC1,uC2,x*2.):mix(uC2,uC3,x*2.-1.);}

// ---- background scenes: each returns the colour behind the artwork ----
// 0 clouds: palette blobs warped by bass, blended with a blurred copy of the photo
vec3 clouds(vec2 uv,vec2 p,float asp,float t){
  vec2 w=p*1.15;vec2 d=vec2(fbm(w+t),fbm(w-t+7.3))-.5;w+=d*(.9+uBass*1.2);
  float n1=fbm(w*1.2+t*1.3),n2=fbm(w*.9-t+3.1);
  vec3 col=mix(uC1,uC2,smoothstep(.3,.7,n1));
  col=mix(col,uC3,smoothstep(.4,.8,n2)*.85);
  col=mix(col,photo(uv+d*(.12+uBass*.1),asp,5.5),uHas*.5);
  vec3 ap=col*(.62+.3*uBass+.12*uBeat);
  vec3 sp=mix(vec3(.07),col*.85,clamp(pow(uv.y,1.4)*.8+uBass*.15+uBeat*.08,0.,1.));
  return mix(ap,sp,uTheme);
}
// 1 aurora: ribbons of light that flare on the beat
vec3 aurora(vec2 p,float t){
  vec3 c=mix(vec3(.02,.02,.05),uC2*.18,p.y+.5);
  for(int i=0;i<4;i++){
    float fi=float(i);
    float y=.22*sin(p.x*(1.3+fi*.4)+t*(6.+fi*2.)+fi*1.7)+.14*fbm(vec2(p.x*1.5+fi*3.,t*4.+fi))-.3+fi*.13;
    float d=p.y-y;
    float g=exp(-abs(d)*(d>0.?5.:22.))*(.5+uBass*.9+uBeat*.5);
    g*=.6+.4*noise(vec2(p.x*14.+fi*5.,t*10.));
    c+=pal(fi/3.)*g*.6;
  }
  return c;
}
// 2 liquid: the photo melts and swirls, stirred by the bass
vec3 liquid(vec2 uv,vec2 p,float asp,float t){
  vec2 q=p*1.4;
  vec2 w1=vec2(fbm(q+t*2.),fbm(q+5.2-t*2.));
  vec2 w2=vec2(fbm(q+3.*w1+1.7+t),fbm(q+3.*w1+9.2-t));
  vec3 c=pal(w2.x*1.4-.2);
  if(uHas>.5)c=mix(photo(uv+(w2-.5)*(.25+uBass*.35),asp,2.),pal(w2.y*1.3-.15),.22);
  return c*(.7+.7*length(w2-.5)+uBeat*.15);
}
// 3 tunnel: rings and spokes rushing past, faster with the music
vec3 tunnel(vec2 p){
  float r=length(p)+1e-3,a=atan(p.y,p.x);
  float z=.3/r+uFlow*.6;
  float rings=smoothstep(.72,1.,sin(z*12.)*.5+.5);
  float spokes=smoothstep(.82,1.,sin(a*8.+z*1.5)*.5+.5);
  vec3 c=pal(fract(z*.15))*max(rings,spokes*.6)*(.45+uBass);
  c+=pal(fract(z*.15+.3))*.1;
  c*=smoothstep(0.,.45,r);
  return c+uC1*exp(-r*7.)*(.4+uBeat*1.2);
}
// 4 stars: flying through a starfield
vec3 stars(vec2 p){
  vec3 c=mix(vec3(.01,.01,.03),uC2*.12,length(p));
  for(int i=0;i<5;i++){
    float fi=float(i);
    float z=fract(uFlow*.1+fi/5.);
    vec2 g=p*mix(20.,.8,z)+fi*17.3;
    vec2 id=floor(g),f=fract(g)-.5;
    float h=hash(id+fi);
    float d=length(f-(vec2(hash(id+3.1),hash(id+7.7))-.5)*.7);
    float s=smoothstep(.05+.05*h,0.,d)*step(.5,h);
    c+=mix(vec3(1.),pal(h),.5)*s*smoothstep(0.,.15,z)*smoothstep(1.,.7,z)*(.8+uTreb+uBeat);
  }
  return c;
}
// 5 kaleidoscope: the photo mirrored into a turning pattern
vec3 kalei(vec2 p,float t){
  float r=length(p),a=atan(p.y,p.x)+t*1.5+uFlow*.04,n=6.;
  a=abs(mod(a,6.2832/n)-3.1416/n);
  vec2 q=vec2(cos(a),sin(a))*r*(1.2+.25*sin(t*3.)+uBass*.25)+vec2(t*.8,t*.5);
  vec3 c=pal(fbm(q*3.)*1.3-.1)*(.4+.9*fbm(q*5.+t));
  if(uHas>.5)c=photo(abs(fract(q*.8)*2.-1.),1.,1.);
  return c*(.7+uBeat*.3);
}
// 6 grid: neon horizon with a floor that ripples with the bass
vec3 grid(vec2 p){
  float hor=.02;
  vec3 glow=pal(.9)*(.5+uBass);
  if(p.y>hor){
    float h=p.y-hor;
    return mix(uC1*.5,uC2*.1,smoothstep(0.,.5,h))+glow*exp(-h*9.);
  }
  float d=hor-p.y,z=.25/d,x=p.x*z;
  float gx=abs(fract(x*1.5)-.5),gz=abs(fract(z*1.2+uFlow*.8)-.5);
  float line=max(smoothstep(fwidth(x*1.5)*1.2+.01,0.,gx),smoothstep(fwidth(z*1.2)*1.2+.01,0.,gz));
  float ripple=.7+uBass*sin(z*2.-uTime*6.)*.5+uBeat*.5;
  return uC2*.06+pal(.15)*line*exp(-z*.12)*ripple*1.2+glow*exp(-d*9.);
}
// 7 waves: layered flowing lines, taller with the bass
vec3 waves(vec2 p){
  vec3 c=mix(uC2*.1,uC3*.16,p.y+.5);
  for(int i=0;i<7;i++){
    float fi=float(i)/6.;
    float amp=(.05+.1*fi)*(.5+uBass*1.2+uMid*.4);
    float y=(fi-.5)*.7+amp*sin(p.x*(2.+fi*3.)+uTime*(.6+fi*.8)+fi*6.)+amp*.5*sin(p.x*(5.+fi*2.)-uTime*.9);
    float d=abs(p.y-y);
    c+=pal(fi)*(.004/(d+.004)*.5+exp(-d*30.)*.25)*(.6+uBeat*.6);
  }
  return c;
}
// 8 mosaic: drifting tiles of the photo that pulse on the beat
vec3 mosaic(vec2 p,float t){
  vec2 g=p*2.6+vec2(t*1.2,sin(t*2.)*.2);
  g.y+=floor(g.x)*.37;
  vec2 id=floor(g),f=fract(g);
  float h=hash(id);
  float s=.42+.05*sin(uTime*(.5+h)+h*6.)+uBeat*.05*h+uBass*.03;
  vec2 q=(f-.5)/s;
  float d=length(max(abs(q)-.75,0.))-.25;
  vec3 tile=pal(h);
  if(uHas>.5)tile=photo(q*.5+.5,1.,1.5);
  tile*=.35+.5*h+uBeat*.25*step(.5,h);
  return mix(vec3(.03)+pal(h)*.03,tile,smoothstep(.03,-.03,d));
}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;float asp=uRes.x/uRes.y;vec2 p=(uv-.5)*vec2(asp,1.);
  float t=uTime*.07;

  int bg=int(uBg+.5);
  vec3 col;
  if(bg==0)col=clouds(uv,p,asp,t);
  else{
    if(bg==1)col=aurora(p,t);
    else if(bg==2)col=liquid(uv,p,asp,t);
    else if(bg==3)col=tunnel(p);
    else if(bg==4)col=stars(p);
    else if(bg==5)col=kalei(p,t);
    else if(bg==6)col=grid(p);
    else if(bg==7)col=waves(p);
    else col=mosaic(p,t);
    col=mix(col,mix(vec3(.07),col,.85),uTheme);
  }
  col*=(1.-.3*dot(p,p))*(1.-uDip);

  // artwork: rounded square (Apple) morphing to a spinning disc (Spotify)
  float s=uArt*(1.+uBeat*.05+uBass*.03);
  vec2 q=(p-vec2(0.,uCy))/s;
  float rr=.3;
  float dd=mix(length(max(abs(q)-1.+rr,0.))-rr,length(q)-1.,uTheme);
  col*=1.-.4*exp(-max(dd,0.)*3.);
  float fw=1.5/(uRes.y*s);
  float m=smoothstep(fw,-fw,dd);
  if(m>0.){
    float c=cos(uRot),sn=sin(uRot);vec2 r=mat2(c,-sn,sn,c)*q;
    r+=normalize(r+1e-5)*sin(length(r)*9.-uTime*5.)*.018*uBass;
    r/=1.+uBeat*.07;
    vec2 a=r*.5+.5;vec2 off=r*.025*uBeat+vec2(.004*uTreb,0.);
    vec3 art;
    if(uHas>.5)art=vec3(photo(a+off,1.,0.).r,photo(a,1.,0.).g,photo(a-off,1.,0.).b);
    else art=mix(uC2,uC1,a.y)*(.55+.45*fbm(r*2.+uTime*.2));
    art*=1.+uBeat*.18;
    col=mix(col,art,m);
  }
  col+=(hash(gl_FragCoord.xy+uTime)-.5)*.02;
  o=vec4(col,1.);
}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
let U={},blankTex;
function initGL(){
  const pr=gl.createProgram();
  gl.attachShader(pr,shader(gl.VERTEX_SHADER,VS));gl.attachShader(pr,shader(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);
  for(const n of ['uRes','uTime','uBass','uMid','uTreb','uBeat','uTheme','uMix','uHas','uAspA','uAspB','uArt','uRot','uCy','uBg','uFlow','uDip','uC1','uC2','uC3','uA','uB'])
    U[n]=gl.getUniformLocation(pr,n);
  gl.uniform1i(U.uA,0);gl.uniform1i(U.uB,1);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  const c=document.createElement('canvas');c.width=c.height=1;
  blankTex=makeTex(c);
}
function makeTex(src){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
let W=0,H=0,artS=.22,cyOff=.06,dpr=1;
function resize(){
  dpr=Math.min(devicePixelRatio||1,1.5);
  W=Math.round(innerWidth*dpr);H=Math.round(innerHeight*dpr);
  glc.width=fxc.width=W;glc.height=fxc.height=H;
  gl.viewport(0,0,W,H);
  artS=Math.min(.22,.36*W/H);
  cyOff=W/H<.8?.15:.06; // portrait: lift the artwork clear of the taller dock
  lyrEl.style.top=(innerHeight*(.5-cyOff)+artS*innerHeight*1.58)+'px';
}

// ---------- photos ----------
const photos=[];let cur=0,nxt=0,mixF=0,fading=false;
function extractPalette(src){
  const s=48,c=document.createElement('canvas');c.width=c.height=s;
  const cx=c.getContext('2d');cx.drawImage(src,0,0,s,s);
  const d=cx.getImageData(0,0,s,s).data,m=new Map();
  for(let i=0;i<d.length;i+=4){
    const k=(d[i]>>5)<<6|(d[i+1]>>5)<<3|(d[i+2]>>5);
    let e=m.get(k);if(!e)m.set(k,e=[0,0,0,0]);
    e[0]+=d[i];e[1]+=d[i+1];e[2]+=d[i+2];e[3]++;
  }
  const cands=[...m.values()].map(e=>{
    const c=[e[0]/e[3]/255,e[1]/e[3]/255,e[2]/e[3]/255],mx=Math.max(...c),sat=mx-Math.min(...c);
    return{c,score:e[3]*(.15+sat*sat*4)*(mx>.15?1:.2)};
  }).sort((a,b)=>b.score-a.score);
  const out=[];
  for(const k of cands){
    if(out.every(o=>Math.hypot(o[0]-k.c[0],o[1]-k.c[1],o[2]-k.c[2])>.25))out.push(k.c);
    if(out.length==3)break;
  }
  while(out.length<3)out.push(out[out.length-1]||[.5,.5,.5]);
  // lift very dark picks so the background never collapses to black
  return out.map(c=>{const mx=Math.max(...c,.001),g=mx<.55?.55/mx:1;return c.map(v=>Math.min(1,v*g))});
}
// returns the new photo's index, or -1 if it failed to load or is no wider than minW
async function addImage(url,minW=0){
  const img=new Image();if(/^https?:/.test(url))img.crossOrigin='anonymous';img.src=url;
  try{await img.decode()}catch{return -1}
  if(img.width<=minW)return -1;
  const k=Math.min(1,1280/Math.max(img.width,img.height));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  photos.push({tex:makeTex(c),asp:c.width/c.height,pal:extractPalette(c),url,src:c});
  lastSwitch=performance.now()/1000;
  renderThumbs();
  return photos.length-1;
}
async function addPhotos(files){
  for(const f of files){
    const url=URL.createObjectURL(f);
    if(await addImage(url)<0)URL.revokeObjectURL(url);
  }
}
function gotoPhoto(i){
  if(!photos.length)return;
  i=(i%photos.length+photos.length)%photos.length;
  if(fading){cur=nxt;fading=false;mixF=0}
  if(i==cur)return;
  nxt=i;fading=true;mixF=0;lastSwitch=performance.now()/1000;
  markThumb();
}
function clearPhotos(){
  for(const p of photos){gl.deleteTexture(p.tex);URL.revokeObjectURL(p.url)}
  photos.length=0;cur=nxt=0;fading=false;mixF=0;renderThumbs();
}
function renderThumbs(){
  const el=$('thumbs');el.innerHTML='';
  photos.forEach((p,i)=>{const im=new Image();im.src=p.url;im.onclick=()=>gotoPhoto(i);el.appendChild(im)});
  if(photos.length){const b=document.createElement('button');b.textContent='×';b.title='Remove all photos';b.onclick=clearPhotos;el.appendChild(b)}
  markThumb();
}
function markThumb(){
  const a=fading?nxt:cur;
  [...$('thumbs').querySelectorAll('img')].forEach((im,i)=>im.classList.toggle('on',i==a));
}

// built-in synth loop so there is something to watch with zero setup
function toggleDemo(){
  if(mode=='demo'){stopOthers('none');setMode('idle');return}
  closeExt();sess('playback');ensureAudio();stopOthers('none');
  const bus=ac.createGain();bus.gain.value=.7;bus.connect(an);bus.connect(out);
  const nb=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;

    const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);

  const sched=(s,t)=>{
    if(s%4==0)tone('sine',150,t,.3,1,40);

    if(s%8==4)hit('bandpass',1800,t,.13,.4);

// ---------- analysis ----------
function analyse(dt,now){
  let b=0,m=0,tr=0;
  // a paused link means silence, even though the mic still hears the room
  const gated=ext&&!ext.playing&&isLive();
  if(gated&&musicOn){musicOn=false;loudT=quietT=0;updateHint();wake()}
  if(an&&mode!='idle'&&!gated){
    an.getByteFrequencyData(freq);
    const hz=ac.sampleRate/an.fftSize;
    const band=(lo,hi)=>{const a=Math.max(1,Math.round(lo/hz)),z=Math.round(hi/hz);let s=0;for(let i=a;i<=z;i++)s+=freq[i];return s/(z-a+1)/255};

    detect(dt,band(200,4000));

      const a=Math.max(1,Math.floor(40*Math.pow(2,i/N*8)/hz)),z=Math.max(a,Math.floor(40*Math.pow(2,(i+1)/N*8)/hz));
      let mx=0;for(let j=a;j<=z&&j<freq.length;j++)if(freq[j]>mx)mx=freq[j];
      const v=Math.pow(Math.min(1,mx/255*sens*(.75+i/N*.7)),1.8);
      bars[i]+=(v-bars[i])*(v>bars[i]?.6:.16);
    }
  }else for(let i=0;i<N;i++)bars[i]*=.9;

  let e=0;

    bt.getFloatFrequencyData(fl);
    const z=Math.max(2,Math.round(150/(ac.sampleRate/bt.fftSize)));
    for(let i=1;i<=z;i++)e+=Math.pow(10,fl[i]/20);
  }
  hist.push(e);if(hist.length>60)hist.shift();
  const avg=hist.reduce((s,v)=>s+v,0)/hist.length;
  if(e>avg*1.35&&e>prevE*1.15&&b>.12&&now-lastBeat>.24){lastBeat=now;L.beat=1;beats++;onBeat(now)}
  prevE=e;

  if(photos.length>1&&mode!='idle'&&now-lastSwitch>15){lastSwitch=now;autoNext()}
}
function onBeat(){
  rings.push({r:1,a:1});
  const sp=theme=='spotify',n=sp?14:8;
  for(let i=0;i<n&&parts.length<300;i++){
    const a=Math.random()*Math.PI*2,v=(sp?.6:.25)+Math.random()*(sp?1:.5);
    parts.push({a,d:1.08,v,life:1,size:(sp?1:2.2)*(.6+Math.random())});
  }
  if(photos.length>1&&beats%8==0)autoNext();
}

// ---------- overlay (spectrum, rings, particles) ----------
function drawFx(dt){
  x.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2-cyOff*H,R=artS*H*(1+L.beat*.05+L.bass*.03),sp=theme=='spotify';
  const p0=pal[0],mx=Math.max(...p0,.001);

  for(let i=rings.length-1;i>=0;i--){
    const g=rings[i];g.r+=dt*1.1;g.a-=dt*1.5;
    if(g.a<=0){rings.splice(i,1);continue}

  }

  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];q.d+=q.v*dt*(1+L.bass);q.life-=dt*(sp?.8:.5);
    if(q.life<=0){parts.splice(i,1);continue}

  }

  if(sp){
    // radial spectrum around the disc, mirrored left/right with bass at the top
    x.lineWidth=Math.max(2,R*.03);
    for(let i=0;i<N*2;i++){
      const len=Math.max(R*.2,Math.min(R*.7,W/2-R*1.1-10*dpr));
      const v=bars[i<N?i:2*N-1-i],a=-Math.PI/2+(i+.5)/(N*2)*Math.PI*2,r0=R*1.1,r1=r0+3*dpr+v*len;
      x.strokeStyle=`rgba(${acc},${.3+v*.7})`;x.beginPath();
      x.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);x.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);x.stroke();
    }
  }else{
    // pill bars under the card, mirrored outward from the center
    const n=24,bw=R*2/(n*2),y0=cy+R*1.3;
    for(let i=0;i<n*2;i++){
      const k=i<n?n-1-i:i-n,v=bars[Math.floor(k/n*N*.8)],h=bw*.5+v*R*.5;
      x.fillStyle=`rgba(255,255,255,${.35+v*.6})`;x.beginPath();
      x.roundRect(cx-R+i*bw+bw*.22,y0-h/2,bw*.56,h,bw*.28);x.fill();
    }
  }
}

// ---------- lyrics ----------
// time-synced lyrics for the current song, looked up by artist and title on lrclib.net
const lyrEl=$('lyr'),lyrIn=$('lyrIn');
let lyr=null,lyrKey='',lyrLine=-2,lyrReq=0;
const cleanTitle=s=>s.replace(/\([^)]*\)|\[[^\]]*\]/g,' ')
  .replace(/\b(official|music video|video|audio|lyrics?|hd|hq|4k|remaster(ed)?|visuali[sz]er)\b/gi,' ')
  .replace(/["“”]/g,'').replace(/\s+/g,' ').trim();
function songMeta(){
  let raw='',artist='',duration=0;
  if(ext&&ext.kind=='yt'){
    if(ext.title=='YouTube')return null;
    raw=ext.title;duration=ext.dur||0;
    const au=ext.author||'';artist=au.replace(/ - Topic$|VEVO$/i,'').trim();
    if(/ - Topic$/.test(au))return{artist,title:cleanTitle(raw),duration};
  }else if(ext){raw=ext.title}
  else if(mode=='file'&&playlist[ti]){
    const tr=playlist[ti];duration=audio.duration||0;
    if(tr.title)return{artist:tr.artist||'',title:tr.title,duration};
    raw=tr.name;
  }
  if(!raw)return null;
  const by=raw.match(/^["“](.+?)["”]\s+by\s+(.+?)(\s+[-–—]\s+|$)/i);
  if(by)return{title:cleanTitle(by[1]),artist:cleanTitle(by[2]),duration};
  const parts=raw.split(/\s+[-–—]\s+/);
  if(parts.length>1)return{artist:cleanTitle(parts[0]),title:cleanTitle(parts[1]),duration};
  return{artist,title:cleanTitle(raw),duration};
}
function parseLRC(s){
  const out=[];
  for(const ln of s.split(/\r?\n/)){
    const text=ln.replace(/\[[^\]]*\]/g,'').trim();
    for(const m of ln.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g))out.push({t:+m[1]*60+ +m[2],text});
  }
  return out.sort((a,b)=>a.t-b.t);
}
async function findLyrics(meta){
  // prefer the version whose length matches the song that is playing
  const pick=list=>{
    let best=null,bs=-1;
    for(const it of Array.isArray(list)?list:[]){
      if(!it.syncedLyrics)continue;
      let s=1;if(meta.duration&&it.duration)s+=Math.max(0,6-Math.abs(it.duration-meta.duration));
      if(s>bs){bs=s;best=it}
    }
    return best;
  };
  const get=async p=>{const r=await fetch('https://lrclib.net/api/search?'+new URLSearchParams(p));return r.ok?r.json():[]};
  let hit=pick(await get(meta.artist?{track_name:meta.title,artist_name:meta.artist}:{track_name:meta.title}));
  if(!hit)hit=pick(await get({q:(meta.artist+' '+meta.title).trim()}));
  return hit?{lines:parseLRC(hit.syncedLyrics),dur:hit.duration||0}:null;
}
// 0 off, 1 on, 2 highlighted; each song remembers its own timing nudge
let lyrMode=0,lyrOff=0,lyrWait=0,lyrTimer=0,lyrOffs={};
try{lyrOffs=JSON.parse(localStorage.getItem('pulse-lyroff'))||{}}catch{}
function showOff(){$('lyrOff').textContent=(lyrOff>0?'+':'')+lyrOff.toFixed(2)+'s'}
function nudge(d){
  lyrOff=Math.max(-30,Math.min(30,Math.round((lyrOff+d)*100)/100));
  showOff();lyrLine=-2;
  if(lyrOff)lyrOffs[lyrKey]=lyrOff;else delete lyrOffs[lyrKey];
  save('pulse-lyroff',JSON.stringify(lyrOffs));
}
function lyrClear(){
  lyr=null;lyrLine=-2;lyrIn.textContent='';lyrIn.style.transform='';
  lyrEl.hidden=true;$('lyrRow').hidden=true;
}
async function lyricsRefresh(){
  clearTimeout(lyrTimer);
  if(!lyrMode){lyrClear();return}
  const meta=songMeta(),key=meta&&meta.title?meta.artist+'|'+meta.title:'';
  if(key==lyrKey)return;
  lyrClear();
  // the song's length picks the right version of the lyrics, so give it a moment to load
  if(key&&!meta.duration&&lyrWait<5){lyrWait++;lyrTimer=setTimeout(lyricsRefresh,600);return}
  lyrWait=0;lyrKey=key;
  if(!key)return;
  const req=++lyrReq;
  let hit=null;
  try{hit=await findLyrics(meta)}catch{}
  if(req!=lyrReq)return;
  if(!hit||!hit.lines.length){toast('No synced lyrics found for this song');return}
  for(const l of hit.lines){const p=document.createElement('p');p.textContent=l.text||'♪';lyrIn.appendChild(p)}
  lyr=hit.lines;lyrOff=lyrOffs[key]||0;showOff();
  lyrEl.hidden=false;$('lyrRow').hidden=false;
  const gap=meta.duration&&hit.dur?meta.duration-hit.dur:0;
  if(Math.abs(gap)>3&&!lyrOffs[key])toast(`This version is ${Math.round(Math.abs(gap))}s ${gap>0?'longer':'shorter'} than the lyrics. Use Earlier or Later to line them up`);
}
function songTime(){
  if(ext&&ext.kind=='yt')return ext.t==null?null:ext.t+(ext.playing?(performance.now()-ext.tAt)/1000:0);
  if(ext&&ext.a)return ext.a.currentTime;
  return mode=='file'?audio.currentTime:null;
}
function drawLyrics(){
  if(!lyr||lyrEl.hidden)return;
  let t=songTime();
  if(t==null)return;
  t+=lyrOff+.2;
  let i=-1;while(i+1<lyr.length&&lyr[i+1].t<=t)i++;
  const ps=lyrIn.children;
  if(i>=0){
    // how far through the line we are, for the highlight sweep
    const end=i+1<lyr.length?lyr[i+1].t:lyr[i].t+5,span=Math.min(8,Math.max(.6,end-lyr[i].t));
    ps[i].style.setProperty('--p',(Math.min(1,(t-lyr[i].t)/span)*100).toFixed(1)+'%');
    ps[i].style.setProperty('--beat',L.beat.toFixed(2));
  }
  if(i==lyrLine)return;
  if(lyrLine>=0&&ps[lyrLine])ps[lyrLine].classList.remove('on');
  lyrLine=i;
  const p=ps[Math.max(0,i)];
  if(i>=0)p.classList.add('on');
  // centre the current line; before the first line, park it one row below centre
  const y=p.offsetTop+p.offsetHeight/2-lyrEl.clientHeight/2-(i<0?p.offsetHeight:0);
  lyrIn.style.transform=`translateY(${-y}px)`;
}
function setLyrics(m,quiet){
  const was=lyrMode;
  lyrMode=m;
  const b=$('bLyr');b.classList.toggle('on',m>0);b.textContent=m==2?'Lyrics+':'Lyrics';
  lyrEl.classList.toggle('hl',m==2);
  save('pulse-lyrics',m||'');
  lyrLine=-2;
  if(!m||!was){lyrKey='\0';lyrWait=0}
  if(!quiet)toast(m==2?'Lyrics highlighted':m==0?'Lyrics off':songMeta()?'Lyrics on':'Lyrics show for songs with a known title: your files or a YouTube link');
  lyricsRefresh();
}

// ---------- main loop ----------
let last=0;
function step(ms){
  const now=ms/1000,dt=Math.min(.05,now-last);last=now;
  analyse(dt,now);

  themeF+=((theme=='spotify'?1:0)-themeF)*Math.min(1,dt*6);
  rot=(rot+dt*(.12+L.mid*.5))%(Math.PI*2);
  // scenes move faster with the music; switching dips through black to hide the cut
  flow+=dt*(.35+L.bass*1.5+L.beat*.6);
  if(bgNext!=bg){dip=Math.min(1,dip+dt*6);if(dip>=1)bg=bgNext}else dip=Math.max(0,dip-dt*4);
  if(fading){mixF+=dt/.7;if(mixF>=1){cur=nxt;fading=false;mixF=0}}
  const has=photos.length>0,A=has?photos[cur]:null,B=has?photos[fading?nxt:cur]:null;
  const target=has&&usePhotoColors?B.pal:THEMES[theme],k=Math.min(1,dt*3);
  for(let i=0;i<3;i++)for(let j=0;j<3;j++)pal[i][j]+=(target[i][j]-pal[i][j])*k;

  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,has?A.tex:blankTex);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,has?B.tex:blankTex);
  gl.uniform2f(U.uRes,W,H);gl.uniform1f(U.uTime,now);
  gl.uniform1f(U.uBass,L.bass);gl.uniform1f(U.uMid,L.mid);gl.uniform1f(U.uTreb,L.treb);gl.uniform1f(U.uBeat,L.beat);
  gl.uniform1f(U.uTheme,themeF);gl.uniform1f(U.uMix,fading?mixF*mixF*(3-2*mixF):0);gl.uniform1f(U.uHas,has?1:0);
  gl.uniform1f(U.uAspA,has?A.asp:1);gl.uniform1f(U.uAspB,has?B.asp:1);
  gl.uniform1f(U.uArt,artS);gl.uniform1f(U.uCy,cyOff);
  gl.uniform1f(U.uBg,bg);gl.uniform1f(U.uFlow,flow);gl.uniform1f(U.uDip,dip);gl.uniform1f(U.uRot,rot*themeF);
  gl.uniform3fv(U.uC1,pal[0]);gl.uniform3fv(U.uC2,pal[1]);gl.uniform3fv(U.uC3,pal[2]);
  gl.drawArrays(gl.TRIANGLES,0,3);

  drawFx(dt);
  drawLyrics();
}
let frameErr=false;
function frame(ms){
  requestAnimationFrame(frame);
  try{step(ms)}catch(e){if(!frameErr){frameErr=true;console.error(e)}}
}

// ---------- UI ----------
function setBg(i,quiet){
  bgNext=(i%BGS.length+BGS.length)%BGS.length;
  $('bBg').textContent=BGS[bgNext];
  save('pulse-bg',bgNext);
  if(!quiet)toast('Background: '+BGS[bgNext]);
}
// file and demo sound go through our own gain; a YouTube or plain-link player has to be asked instead
// (iOS ignores that request: there only the phone's volume buttons change a video's loudness)
function setVol(v){
  vol=Math.max(0,Math.min(1,v));
  if(out)out.gain.value=vol;
  if(ext&&ext.kind=='yt')ext.el.contentWindow.postMessage(JSON.stringify({event:'command',func:'setVolume',args:[Math.round(vol*100)]}),YT);
  if(ext&&ext.a)ext.a.volume=vol;
  save('pulse-vol',vol);
}
function setTheme(t){
  theme=t;document.documentElement.dataset.skin=t;
  [...$('themeSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.t==t));
  try{localStorage.setItem('pulse-theme',t)}catch{}
}
let idleT;
function wake(){
  document.body.classList.remove('idle');clearTimeout(idleT);
  idleT=setTimeout(()=>{
    const busy=mode=='file'||mode=='demo'||musicOn;
    if(busy&&!dragO&&document.activeElement.id!='linkIn'&&!(canHover&&document.querySelector('.dock:hover,.top:hover,.thumbs:hover,.ext:hover')))document.body.classList.add('idle');
  },3500);
}
const canHover=matchMedia('(hover:hover)').matches;
if(!x.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(a,b,w,h,r){
  this.moveTo(a+r,b);this.arcTo(a+w,b,a+w,b+h,r);this.arcTo(a+w,b+h,a,b+h,r);this.arcTo(a,b+h,a,b,r);this.arcTo(a,b,a+w,b,r);this.closePath();
};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function toggleFull(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}

$('themeSeg').onclick=e=>{if(e.target.dataset.t)setTheme(e.target.dataset.t)};
$('bMusic').onclick=()=>$('fMusic').click();
$('bPhotos').onclick=()=>$('fPhotos').click();
$('fMusic').onchange=e=>{addTracks([...e.target.files]);e.target.value=''};
$('fPhotos').onchange=e=>{addPhotos([...e.target.files]);e.target.value=''};
$('bMic').onclick=toggleMic;
$('bStream').onclick=toggleStream;
$('bStream').hidden=!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)||!canHover;
$('bFull').hidden=!document.documentElement.requestFullscreen;
$('bDemo').onclick=demoClick;
$('bStar').onclick=toggleStar;
$('bLink').onclick=()=>{const r=$('linkRow');r.hidden=!r.hidden;if(!r.hidden)$('linkIn').focus()};
$('bGo').onclick=loadLink;
$('linkIn').onkeydown=e=>{if(e.key=='Enter')loadLink()};
$('bExtX').onclick=closeExt;
$('bSync').onclick=resync;
$('bBg').onclick=()=>setBg(bgNext+1);
$('bLyr').onclick=()=>setLyrics((lyrMode+1)%3);
$('bLyrE').onclick=()=>nudge(.25);
$('bLyrL').onclick=()=>nudge(-.25);
$('bPlay').onclick=togglePlay;
$('bPrev').onclick=()=>playTrack(ti-1);
$('bNext').onclick=()=>playTrack(ti+1);
$('bFull').onclick=toggleFull;
$('sens').oninput=e=>sens=+e.target.value;
$('vol').oninput=e=>setVol(+e.target.value);
try{const sv=localStorage.getItem('pulse-vol');if(sv!=null&&sv!==''){vol=Math.max(0,Math.min(1,+sv||0));$('vol').value=vol}}catch{}
$('cColors').onchange=e=>usePhotoColors=e.target.checked;
let seeking=false;
$('seek').oninput=()=>seeking=true;
$('seek').onchange=e=>{if(audio.duration)audio.currentTime=e.target.value/1000*audio.duration;seeking=false};
audio.onplay=audio.onpause=syncPlay;
audio.onended=()=>playTrack(ti+1);
audio.ontimeupdate=()=>{
  if(!seeking&&audio.duration)$('seek').value=audio.currentTime/audio.duration*1000;
  $('tCur').textContent=fmt(audio.currentTime);$('tDur').textContent=fmt(audio.duration);
};
addEventListener('resize',()=>{resize();if(!extEl.hidden)placeExt(ex,ey)});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  if(ac&&ac.state!='running')ac.resume();
  if(ext&&!isLive()&&!canHover&&autoRetry<3){autoRetry++;startSync()}
});
addEventListener('orientationchange',()=>setTimeout(resize,250));
addEventListener('pointermove',e=>{if(e.pointerType=='mouse')wake()});
addEventListener('pointerdown',e=>{
  if(ac&&ac.state!='running')ac.resume();
  // tapping the visuals toggles the controls
  if(e.target===glc&&mode!='idle'&&!document.body.classList.contains('idle')){clearTimeout(idleT);document.body.classList.add('idle')}
  else wake();
});
addEventListener('keydown',e=>{
  wake();
  if(e.target.tagName=='INPUT')return;
  if(e.code=='Space'){e.preventDefault();togglePlay()}
  else if(e.key=='f'||e.key=='F')toggleFull();
  else if(e.key=='t'||e.key=='T')setTheme(theme=='apple'?'spotify':'apple');
  else if(e.key=='b'||e.key=='B')setBg(bgNext+1);
  else if(e.key=='ArrowRight')gotoPhoto((fading?nxt:cur)+1);
  else if(e.key=='ArrowLeft')gotoPhoto((fading?nxt:cur)-1);
});
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drag')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag')});
addEventListener('drop',e=>{
  e.preventDefault();document.body.classList.remove('drag');
  const fs=[...e.dataTransfer.files];
  const tracks=fs.filter(f=>f.type.startsWith('audio/')),imgs=fs.filter(f=>f.type.startsWith('image/'));
  if(imgs.length)addPhotos(imgs);
  if(tracks.length)addTracks(tracks);
});

if(!gl){$('hint').textContent='This browser does not support WebGL2'}
else{
  initGL();resize();
  let saved='apple';try{saved=localStorage.getItem('pulse-theme')||'apple'}catch{}
  setTheme(saved);themeF=saved=='spotify'?1:0;pal=THEMES[saved].map(c=>c.slice());
  let sb=0;try{sb=+localStorage.getItem('pulse-bg')||0}catch{}
  setBg(sb,true);bg=bgNext;
  let sl='';try{sl=localStorage.getItem('pulse-lyrics')||''}catch{}
  if(sl)setLyrics(+sl||1,true);
  syncPlay();requestAnimationFrame(frame);

  // if the mic was on last time, start listening again without being asked
  let want='';try{want=localStorage.getItem('pulse-live')||''}catch{}
  if(want=='mic'&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    armed=true;updateHint();
    const go=e=>{
      if(!armed)return;
      armed=false;
      if(e&&e.target.closest('button,input,label')){updateHint();return}
      toggleMic();
    };
    if(navigator.permissions)navigator.permissions.query({name:'microphone'}).then(p=>{if(p.state=='granted')go()}).catch(()=>{});
    addEventListener('pointerdown',go,{once:true});
  }
}
</script>
